<style>
  :root { --blue: #0d3b9e; --bg: #f5f3ee; --ink: #0d3b9e; --dim: rgba(13,59,158,0.4); --mid: rgba(13,59,158,0.7); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background-color: var(--bg); background-image: radial-gradient(circle, rgba(13,59,158,0.12) 1px, transparent 1px); background-size: 32px 32px; color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 14px; line-height: 1.6; padding: 64px 80px 120px; min-height: 100vh; width: 100%; }
  .back { font-size: 11px; letter-spacing: 0.18em; color: var(--dim); text-decoration: none; display: inline-block; margin-bottom: 44px; transition: color 0.1s; font-weight: 300; }
  .back:hover { color: var(--ink); }
  .page-title { font-size: 28px; font-weight: 700; letter-spacing: 0.08em; color: var(--blue); margin-bottom: 4px; }
  .page-sub { font-size: 11px; letter-spacing: 0.18em; color: var(--dim); font-weight: 300; }
  .divider { color: var(--dim); margin: 28px 0; font-size: 12px; user-select: none; }

  /* big photo frame */
  .frames-area {
    position: relative;
    height: 480px;
    margin: 52px 0 52px 0;
  }

  .img-frame {
    position: absolute;
    border: 1px solid rgba(13,59,158,0.4);
    background: rgba(13,59,158,0.02);
  }

  /* blueprint corner marks */
  .img-frame::before {
    content: '';
    position: absolute;
    top: -1px; left: -1px;
    width: 14px; height: 14px;
    border-top: 2px solid var(--blue);
    border-left: 2px solid var(--blue);
  }

  .img-frame::after {
    content: '';
    position: absolute;
    bottom: -1px; right: -1px;
    width: 14px; height: 14px;
    border-bottom: 2px solid var(--blue);
    border-right: 2px solid var(--blue);
  }

  .img-frame-label {
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--dim);
    padding: 5px 10px;
    border-bottom: 1px solid rgba(13,59,158,0.15);
    font-weight: 300;
  }

  .img-frame-body {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
    font-size: 10px;
    letter-spacing: 0.15em;
    font-weight: 300;
    opacity: 0.5;
  }

  /* photo frame: big, centered-ish */
  .frame-photo { width: 340px; top: 0px; left: 0px; }
  .frame-photo .img-frame-body { height: 440px; }

  /* links */
  .links-label {
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--dim);
    margin-bottom: 16px;
    font-weight: 300;
  }

  .links-list { list-style: none; }

  .links-list li {
    margin-bottom: 10px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .links-list .link-num {
    font-size: 10px;
    color: var(--dim);
    font-weight: 300;
    min-width: 40px;
  }

  .links-list a {
    font-size: 13px;
    color: var(--blue);
    text-decoration: none;
    font-weight: 400;
    letter-spacing: 0.05em;
    border-bottom: 1px solid transparent;
    transition: border-color 0.1s;
  }

  .links-list a:hover { border-bottom-color: var(--dim); }
</style>
</head>
